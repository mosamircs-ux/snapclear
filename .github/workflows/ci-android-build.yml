name: CI Android build check

# Manual run, or push to the ci-build branch. Verifies the app compiles and
# uploads the debug APKs. Release signing is handled separately.
on:
  workflow_dispatch:
  push:
    branches: [ci-build]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Assemble debug
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log
      - name: Summarise build errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Execution failed|Could not |FAILED" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::${l}"; done
      - name: Upload debug APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: warn
