name: CI Android build check

# Manual run, or push to the ci-build branch. Verifies the app compiles and
# uploads the debug APKs. Release signing is handled separately.
on:
  workflow_dispatch:
  push:
    branches: [ci-build]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace --no-daemon
      - name: Upload debug APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: warn
